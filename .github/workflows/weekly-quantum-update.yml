name: 🔄 量子コンピューター ニュース更新（週次 / 月次）

on:
  schedule:
    # 毎週月曜日 午前9時（日本時間）= UTC 0:00 → 週次更新
    - cron: '0 0 * * 1'
    # 毎月1日 午前9時（日本時間）= UTC 0:00 → 月次まとめ更新
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '更新モード'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
      dry_run:
        description: 'dry-run（ファイルを変更せず結果のみ確認）'
        required: false
        default: false
        type: boolean

jobs:
  update-quantum-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ファイルをコミット・プッシュするため
      models: read      # GitHub Models で英語ニュースを日本語に翻訳するため

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          # 再実行時に rebase できるよう全履歴を取得する
          fetch-depth: 0

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      # 毎月1日の cron（0 0 1 * *）なら monthly、それ以外は weekly。
      # 手動実行時は入力値をそのまま使う。
      - name: 更新モードを判定
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 0 1 * *" ]; then
            MODE="monthly"
          else
            MODE="weekly"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "🔧 更新モード: $MODE"

      - name: 更新前の構造チェック（ベースライン）
        run: python scripts/validate_html.py || echo "⚠️ 更新前から構造に問題あり（続行）"

      # 英語ニュースの日本語化は GITHUB_TOKEN による GitHub Models（無料枠）で行う。
      # ANTHROPIC_API_KEY が Secrets にあればそちらを優先。
      # どちらも使えない場合もジョブは失敗せず、英語のまま出力される。
      - name: 量子ニュースを調査してHTMLを更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/update_quantum.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # 更新でタグの開閉が崩れた場合はここで失敗させ、壊れた状態のpushを防ぐ
      - name: 更新後の構造チェック
        run: python scripts/validate_html.py

      - name: 変更をコミット & プッシュ
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.mode.outputs.mode }}" = "monthly" ]; then
            LABEL="月次"
          else
            LABEL="週次"
          fi

          BRANCH="${{ github.event.repository.default_branch }}"

          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ 変更なし。コミットをスキップします"
            exit 0
          fi
          git commit -m "🔄 ${LABEL}量子ニュース更新 $(date '+%Y-%m-%d')"

          # 過去の実行を再実行した場合、checkout は detached HEAD になるため
          # `git push` だけでは "not currently on a branch" で失敗する。
          # 明示的に HEAD:ブランチ名 を指定し、他のpushがあった場合に備えて
          # rebase してから送る。
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH" || {
            echo "⚠️ rebase に失敗したため中止します"
            git rebase --abort || true
            exit 1
          }
          git push origin "HEAD:$BRANCH"

      - name: サマリーを出力
        if: always()
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            TRANSLATE="✅ Claude API"
          else
            TRANSLATE="✅ GitHub Models（無料枠・追加設定不要）"
          fi
          {
            echo "## 🔄 量子ニュース更新完了"
            echo ""
            echo "- **モード**: ${{ steps.mode.outputs.mode }}"
            echo "- **実行日**: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            echo "- **翻訳**: $TRANSLATE"
            echo "- **構造チェック**: ✅ パス"
          } >> "$GITHUB_STEP_SUMMARY"
